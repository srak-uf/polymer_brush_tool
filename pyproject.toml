[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polymer-brush-tool"
version = "0.1.0"
description = "Polymer brush structure modeling and GROMACS MD preparation toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "ase>=3.22",
    "parmed>=4.0",
    "pyyaml>=6.0",
]

[project.scripts]
pbuild = "polymer_brush_tool.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/polymer_brush_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
